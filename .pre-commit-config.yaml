# Pre-commit hooks for agent-skill-scanner
# Install with: pre-commit install
# Then every commit runs the scanner over staged skill files (SKILL.md etc.)
repos:
  - repo: local
    hooks:
      - id: skill-scan-staged
        name: skill-scan (staged skill files)
        entry: python src/scanner.py
        language: system
        types: [text]
        files: '\.(md|json|ya?ml)$'
        exclude: '^(README|LICENSE|rules/|test/|examples/)'
        # Block only HIGH/CRITICAL: exit code 2/3 stops the commit.
        # With --min-risk HIGH the scanner still exits 2/3 for HIGH+;
        # LOW/MEDIUM exit 0/1, and pre-commit treats non-zero as failure,
        # so we map exit codes: 0/1 pass, 2/3 fail via `fail_fast` semantics.
        fail_fast: false
        pass_filenames: true
      - id: rules-sync-check
        name: rules.js in sync with scanner-rules.json
        entry: bash -c 'node scripts/sync-rules.mjs && git diff --exit-code -- rules/rules.js'
        language: system
        files: 'rules/scanner-rules\.json$'
        pass_filenames: false
