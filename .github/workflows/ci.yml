name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Node engine tests
        run: npm test

      - name: Python engine tests
        run: python test/test_scanner.py

      - name: Cross-engine consistency (same output for a fixture set)
        run: |
          node src/cli.js examples --json > /tmp/node.json
          python src/scanner.py examples --json > /tmp/py.json
          python -c "
          import json
          n = json.load(open('/tmp/node.json'))
          p = json.load(open('/tmp/py.json'))
          for r in n['reports']: r.pop('scannedAt', None)
          for r in p['reports']: r.pop('scannedAt', None)
          assert n == p, 'Node/Python outputs differ'
          print('Node/Python outputs identical')
          "

      - name: Rule bundle in sync (rules.js regenerates clean)
        run: |
          node scripts/sync-rules.mjs
          git diff --exit-code -- rules/rules.js
          echo "rules/rules.js is in sync with scanner-rules.json"
