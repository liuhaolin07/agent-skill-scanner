name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Node engine tests
        run: |
          npm test
          node --test test/corpus.test.js
          node --test test/cli.test.js

      - name: Python engine tests
        run: |
          python test/test_scanner.py
          python test/test_corpus.py
          python test/test_cli.py

      - name: Rule file validation (structure + bundle in sync)
        run: |
          npm run check:rules
          npm run build:rules
          git diff --exit-code -- rules/rules.js
          echo "rules/rules.js is in sync with scanner-rules.json"

      - name: Cross-engine consistency (same output for a fixture set)
        # exit codes reflect the fixture risk (risky/ is CRITICAL by design);
        # capture output regardless and compare the JSON only
        shell: bash
        run: |
          node src/cli.js examples --json > "${{ runner.temp }}/node.json" || true
          python src/scanner.py examples --json > "${{ runner.temp }}/py.json" || true
          python -c "
          import json
          n = json.load(open(r'${{ runner.temp }}' + '/node.json'))
          p = json.load(open(r'${{ runner.temp }}' + '/py.json'))
          for r in n['reports']: r.pop('scannedAt', None)
          for r in p['reports']: r.pop('scannedAt', None)
          assert n == p, 'Node/Python outputs differ'
          print('Node/Python outputs identical')
          "

      - name: Cross-engine SARIF consistency
        shell: bash
        run: |
          node src/cli.js examples/risky --sarif > "${{ runner.temp }}/node-sarif.json" || true
          python src/scanner.py examples/risky --sarif > "${{ runner.temp }}/py-sarif.json" || true
          python -c "
          import json
          n = json.load(open(r'${{ runner.temp }}' + '/node-sarif.json'))
          p = json.load(open(r'${{ runner.temp }}' + '/py-sarif.json'))
          n_rules = sorted(r['id'] for r in n['runs'][0]['tool']['driver']['rules'])
          p_rules = sorted(r['id'] for r in p['runs'][0]['tool']['driver']['rules'])
          assert n_rules == p_rules, 'SARIF rules differ'
          n_res = sorted((r['ruleId'], r['level'], r['locations'][0]['physicalLocation']['region']['startLine']) for r in n['runs'][0]['results'])
          p_res = sorted((r['ruleId'], r['level'], r['locations'][0]['physicalLocation']['region']['startLine']) for r in p['runs'][0]['results'])
          assert n_res == p_res, 'SARIF results differ'
          print('SARIF outputs identical')
          "
