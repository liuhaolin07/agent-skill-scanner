name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Node engine tests
        run: |
          npm test
          node --test test/corpus.test.js
          node --test test/cli.test.js

      - name: Python engine tests
        run: |
          python test/test_scanner.py
          python test/test_corpus.py
          python test/test_cli.py

      - name: Rule file validation (structure + bundle in sync)
        run: |
          npm run check:rules
          npm run build:rules
          git diff --exit-code -- rules/rules.js
          echo "rules/rules.js is in sync with scanner-rules.json"

      - name: Cross-engine consistency (same output for a fixture set)
        # exit codes reflect the fixture risk (risky/ is CRITICAL by design);
        # capture output regardless and compare the JSON only. Unique file
        # names (run id + job index) avoid stale-file races in runner.temp.
        shell: bash
        run: |
          NF="${{ runner.temp }}/node-${{ github.run_id }}-${{ strategy.job-index }}.json"
          PF="${{ runner.temp }}/py-${{ github.run_id }}-${{ strategy.job-index }}.json"
          node src/cli.js examples --json > "$NF" || echo "node exit $?"
          python src/scanner.py examples --json > "$PF" || echo "python exit $?"
          python -c "
          import json, os
          nf = os.environ['NF']; pf = os.environ['PF']
          n = json.load(open(nf)); p = json.load(open(pf))
          for r in n['reports']: r.pop('scannedAt', None)
          for r in p['reports']: r.pop('scannedAt', None)
          if n != p:
              def first_diff(a, b, path='root'):
                  if type(a) is not type(b):
                      return f'{path}: type {type(a).__name__} vs {type(b).__name__}'
                  if isinstance(a, dict):
                      for k in a:
                          if k not in b:
                              return f'{path}.{k}: missing in py'
                          r = first_diff(a[k], b[k], f'{path}.{k}')
                          if r:
                              return r
                      for k in b:
                          if k not in a:
                              return f'{path}.{k}: missing in node'
                  elif isinstance(a, list):
                      if len(a) != len(b):
                          return f'{path}: len {len(a)} vs {len(b)}'
                      for i, (x, y) in enumerate(zip(a, b)):
                          r = first_diff(x, y, f'{path}[{i}]')
                          if r:
                              return r
                  elif a != b:
                      return f'{path}: {a!r} vs {b!r}'
                  return None
              print('FIRST DIFF:', first_diff(n, p))
              raise SystemExit('Node/Python outputs differ')
          print('Node/Python outputs identical')
          "
        env:
          NF: "${{ runner.temp }}/node-${{ github.run_id }}-${{ strategy.job-index }}.json"
          PF: "${{ runner.temp }}/py-${{ github.run_id }}-${{ strategy.job-index }}.json"

      - name: Cross-engine SARIF consistency
        shell: bash
        run: |
          NS="${{ runner.temp }}/node-sarif-${{ github.run_id }}-${{ strategy.job-index }}.json"
          PS="${{ runner.temp }}/py-sarif-${{ github.run_id }}-${{ strategy.job-index }}.json"
          node src/cli.js examples/risky --sarif > "$NS" || echo "node exit $?"
          python src/scanner.py examples/risky --sarif > "$PS" || echo "python exit $?"
          python -c "
          import json, os
          ns = os.environ['NS']; ps = os.environ['PS']
          n = json.load(open(ns)); p = json.load(open(ps))
          n_rules = sorted(r['id'] for r in n['runs'][0]['tool']['driver']['rules'])
          p_rules = sorted(r['id'] for r in p['runs'][0]['tool']['driver']['rules'])
          assert n_rules == p_rules, 'SARIF rules differ'
          n_res = sorted((r['ruleId'], r['level'], r['locations'][0]['physicalLocation']['region']['startLine']) for r in n['runs'][0]['results'])
          p_res = sorted((r['ruleId'], r['level'], r['locations'][0]['physicalLocation']['region']['startLine']) for r in p['runs'][0]['results'])
          assert n_res == p_res, 'SARIF results differ'
          print('SARIF outputs identical')
          "
        env:
          NS: "${{ runner.temp }}/node-sarif-${{ github.run_id }}-${{ strategy.job-index }}.json"
          PS: "${{ runner.temp }}/py-sarif-${{ github.run_id }}-${{ strategy.job-index }}.json"
